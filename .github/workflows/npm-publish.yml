name: Stage on npm

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to stage
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - run: npx --yes npm@11.15.0 stage publish --access public
